        body {

        }

            background-color: #d4af37;

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fef3c7; }
        ::-webkit-scrollbar-thumb { background: #064e3b; border-radius: 10px; }
